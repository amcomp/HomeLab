[lab]
host1 ansible_host= YourHostIP

[lab:vars]
ansible_python_interpreter=/usr/bin/python3
ansible_user= {{ admin_user }}
ansible_ssh_private_key_file= YourLocalSSHkeyLocation

[firewalls]
opnsense ansible_host= YourFirewallIP
opnsense ansible_python_interpreter= YourLocalPythonInterpreterLocation