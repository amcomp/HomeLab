services:
  unifi-network-application:
    image: lscr.io/linuxserver/unifi-network-application:latest
    container_name: unifi-network-application
    depends_on:
      unifi-db:
        condition: service_healthy
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Indiana/Indianapolis
      - MONGO_USER=unifi
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_HOST=unifi-db
      - MONGO_PORT=27017
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
      # - MEM_LIMIT=1024 #optional
      # - MEM_STARTUP=1024 #optional
    volumes:
      - ./config:/config
    ports:
      - 8443:8443        # web UI
      - 3478:3478/udp    # STUN
      - 10001:10001/udp  # AP discovery
      - 8080:8080        # device inform (keep 8080:8080)
      # - 1900:1900/udp  # L2 discovery (optional)
      # - 8843:8843      # guest portal HTTPS (optional)
      # - 8880:8880      # guest portal HTTP (optional)
      # - 6789:6789      # mobile speed test (optional)
      # - 5514:5514/udp  # remote syslog (optional)
    restart: unless-stopped

  unifi-db:
    image: docker.io/mongo:7.0   # pin this; mongo has no auto major-version upgrades. 8.0 only if UniFi is 9.0+
    container_name: unifi-db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASS}
      - MONGO_USER=unifi
      - MONGO_PASS=${MONGO_PASS}
      - MONGO_DBNAME=unifi
      - MONGO_AUTHSOURCE=admin
    volumes:
      - ./db:/data/db
      - ./init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # No ports published on purpose: only the UniFi container needs to reach Mongo.