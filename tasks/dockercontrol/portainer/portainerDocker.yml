---
- name: Deploy portainer
  hosts: lab
  become: true
  

  tasks:
    - name: Ensure target project directory exists
      ansible.builtin.file:
        path: "{{ remote_dir }}/portainer"
        state: directory
        mode: '0755'

    - name: Copy templated docker-compose.yml to host
      ansible.builtin.template:
        src: ./docker-compose.yml
        dest: "{{ remote_dir }}/portainer/docker-compose.yml"
        mode: '0644'

    - name: Start or update the Docker Compose stack
      community.docker.docker_compose_v2:
        project_src: "{{ remote_dir }}/portainer"
        state: present
        pull: always     # Pulls new images if available
