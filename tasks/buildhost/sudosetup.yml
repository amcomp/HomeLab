- name: Enable passwordless sudo for cloud user
  hosts: lab
  become: true
  tasks:
    - name: Passwordless sudo for {{ admin_user }}
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ admin_user }}"
        content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s